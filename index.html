<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Color Pallet — Color Tools for Developers &amp; Designers</title>
    <meta
      name="description"
      content="A fast, open-source color toolkit for exploring colors, generating palettes and gradients, converting color formats, and checking contrast."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f11" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Color Pallet" />
    <meta property="og:image" content="https://files.catbox.moe/o949te.png" />
    <meta property="og:title" content="Color Pallet — Color Tools for Developers &amp; Designers" />
    <meta
      property="og:description"
      content="A fast, open-source color toolkit for exploring colors, generating palettes and gradients, converting color formats, and checking contrast."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="https://files.catbox.moe/o949te.png" />
    <meta name="twitter:title" content="Color Pallet — Color Tools for Developers &amp; Designers" />
    <meta
      name="twitter:description"
      content="A fast, open-source color toolkit for exploring colors, generating palettes and gradients, converting color formats, and checking contrast."
    />

    <link rel="icon" type="image/png" href="https://files.catbox.moe/o949te.png" />
    <link rel="shortcut icon" href="https://files.catbox.moe/o949te.png" />
    <link rel="apple-touch-icon" href="https://files.catbox.moe/o949te.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('color-pallet:theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Color Pallet needs JavaScript to run. Everything happens locally in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
